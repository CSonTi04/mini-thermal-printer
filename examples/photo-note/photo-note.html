<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root { --page-padding: 16px; --font-size: 15px; }
      .card { border-block: 3px solid black; }
      h1 { margin: 2px 0; font-size: 27px; }
      .picture { border: 2px solid black; }
      .message { font-size: 18px; line-height: 1.3; }
      .signature { font-size: 20px; font-weight: 700; }
      .caption { font-size: 11px; }
    </style>
  </head>
  <body>
    <main class="receipt receipt--padded column card">
      <header class="text-center no-break">
        <div>{{ date }}</div>
        <h1>{{ title }}</h1>
      </header>

      {% if photo_prepared %}
        <img class="photo picture" src="{{ printer_image(photo_prepared, width=348, dither=photo_dither, effects=photo_effects) }}" alt="{{ caption }}">
      {% else %}
        <img class="photo picture" src="{{ photo }}" alt="{{ caption }}">
      {% endif %}
      <div class="caption text-center">{{ caption }}</div>

      <div class="message">{{ message }}</div>
      <footer class="text-right">
        <div>— {{ from }}</div>
        <div class="signature">{{ signoff }}</div>
      </footer>
    </main>
  </body>
</html>
