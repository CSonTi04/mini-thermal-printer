<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root { --page-padding: 12px; --font-size: 14px; }
      .label { border: 3px solid black; }
      h1 { margin: 0; font-size: 25px; line-height: 1.1; }
      .location { border: 3px solid black; font-size: 30px; font-weight: 900; }
      .stock { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .stock > div { border: 2px solid black; }
      .number { display: block; font-size: 25px; font-weight: 900; }
      .caption { font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .codes { align-items: center; }
      .codes .qr-code { flex: 0 0 auto; }
      .codes .barcode { min-width: 0; flex: 1; }
      .low { background: black; color: white; font-size: 17px; font-weight: 900; }
    </style>
  </head>
  <body>
    <main class="receipt receipt--padded column label">
      <header class="text-center no-break">
        <div class="caption">Inventory item</div>
        <h1>{{ item.name }}</h1>
        <div>SKU {{ item.sku }}</div>
      </header>

      <div class="location text-center p-2">{{ item.location }}</div>
      <div class="stock no-break">
        <div class="text-center p-1"><span class="caption">On hand</span><span class="number">{{ item.quantity }} {{ item.unit }}</span></div>
        <div class="text-center p-1"><span class="caption">Reorder at</span><span class="number">{{ item.reorder_at }}</span></div>
      </div>
      {% if item.quantity <= item.reorder_at %}<div class="low text-center p-2">REORDER STOCK</div>{% endif %}

      <div class="row codes no-break">
        <img class="machine-code qr-code" src="{{ qr_code(item.lookup_url, scale=2) }}" alt="Item lookup QR code">
        <img class="machine-code barcode" src="{{ barcode(item.sku, module_height=9, include_text=false) }}" alt="SKU barcode">
      </div>
      <div class="text-center"><strong>{{ item.sku }}</strong></div>
    </main>
  </body>
</html>
