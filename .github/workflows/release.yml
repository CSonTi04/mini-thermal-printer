name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    name: Verify and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and release tools
        run: >-
          python -m pip install -e ".[dev]"
          "build>=1.3,<2"
          "twine>=6,<8"

      - name: Verify tag and package version
        run: python scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run the hardware-free test rig
        run: python -m pytest -m "not hil"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
