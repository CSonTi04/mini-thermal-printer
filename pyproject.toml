[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tronic-mini-printer"
version = "0.1.0"
description = "Clean-room Python driver for the Lidl TRONIC Mini Pocket Printer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22,<2",
    "Pillow>=10,<13",
    "pyserial>=3.5,<4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
tronic-printer = "tronic_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "hil: requires the physical printer and explicit --live consent",
    "printing: moves paper or activates the print head and requires --allow-printing",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
