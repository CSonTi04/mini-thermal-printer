[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tronic-mini-printer"
version = "0.3.0"
description = "Clean-room Python driver for the Lidl TRONIC Mini Pocket Printer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22,<2",
    "Jinja2>=3.1,<4",
    "Pillow>=10,<13",
    "pyserial>=3.5,<4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "python-barcode>=0.15,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "segno>=1.6,<2",
    "zxing-cpp>=2.2,<3",
]
html = [
    "playwright>=1.50,<2",
    "python-barcode>=0.15,<1",
    "segno>=1.6,<2",
]

[project.scripts]
tronic-printer = "tronic_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tronic-mini-printer/examples" = ["examples/README.md"]
"share/tronic-mini-printer/examples/receipt" = ["examples/receipt/*"]
"share/tronic-mini-printer/examples/shipping-label" = ["examples/shipping-label/*"]
"share/tronic-mini-printer/examples/postcard-address" = ["examples/postcard-address/*"]
"share/tronic-mini-printer/examples/parcel-drop-in" = ["examples/parcel-drop-in/*"]
"share/tronic-mini-printer/examples/checklist" = ["examples/checklist/*"]
"share/tronic-mini-printer/examples/kitchen-ticket" = ["examples/kitchen-ticket/*"]
"share/tronic-mini-printer/examples/inventory-label" = ["examples/inventory-label/*"]
"share/tronic-mini-printer/examples/event-ticket" = ["examples/event-ticket/*"]
"share/tronic-mini-printer/examples/photo-note" = ["examples/photo-note/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "hil: requires the physical printer and explicit --live consent",
    "printing: moves paper or activates the print head and requires --allow-printing",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
